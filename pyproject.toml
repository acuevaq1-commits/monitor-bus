[project]
name = "monitor-integraciones"
version = "0.1.0"
description = "Monitor del Bus de Integraciones Banner–SAP"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.4,<3", "jinja2>=3.1,<4", "python-multipart>=0.0.9", "itsdangerous>=2.2,<3", "alembic>=1.13,<2"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
